server {
    listen 80;
    server_name _;

    # Discourage indexing everywhere (safety requirement).
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (Phase 2 React router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
