server {
    listen 80;
    server_name _;

    # Discourage indexing everywhere (safety requirement).
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html;
    index index.html;

    # RECON LAB: expose a leaked .git directory. The build ships a git snapshot
    # under /dotgit (a real repo whose *history* still contains a secrets file);
    # this alias makes it discoverable at /.git/ for git-dumper-style recon.
    location /.git/ {
        alias /usr/share/nginx/html/dotgit/;
        autoindex on;
    }

    # Source maps (*.map) are served as static files (recon: JS analysis).

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
